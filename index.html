<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cottonmouth Clown - The Midway</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="projector"></div>

<div id="landing">
    <div class="landing-content">

        <h1>STEP RIGHT UP, FREAKS AND FIENDS</h1>

        <p class="tagline">The Freakshow Never Ends</p>

        <div class="warning-box">
            <h3>⚠️ EXPLICIT CONTENT WARNING ⚠️</h3>

            <p>Horrorcore music • Mature language • Disturbing imagery</p>

            <p>Intended for mature audiences.</p>

            <p><strong>🎪 Proceed At Your Own Risk</strong></p>
        </div>

        <button id="enterButton">ENTER THE MIDWAY</button>

    </div>
</div>

<div id="gateFlash">OPEN THE GATES!</div>

<div id="midway" class="hidden">

    <div class="midway-hero">
        <!-- The artwork and all six clickable hitboxes use the SAME SVG viewBox.
             This avoids CSS/object-fit/viewport coordinate drift at all aspect ratios. -->
        <svg class="midway-scene" viewBox="0 0 1448 1086"
             xmlns="http://www.w3.org/2000/svg"
             aria-label="Midway entrance with clickable attraction signs" role="group">
            <image href="assets/images/websitebackgroundopen.png"
                   x="0" y="0" width="1448" height="1086"
                   preserveAspectRatio="none" />
            <g class="midway-signs">
              <a href="bigtop.html" aria-label="Big Top">
                <rect x="1140" y="525" width="260" height="55" />
              </a>
              <a href="funhouse.html" aria-label="Funhouse">
                <rect x="1135" y="586" width="265" height="56" />
              </a>
              <a href="games.html" aria-label="Games">
                <rect x="1137" y="646" width="265" height="57" />
              </a>
              <a href="music.html" aria-label="Music Tent">
                <rect x="1135" y="709" width="272" height="57" />
              </a>
              <a href="freakshow.html" aria-label="Freak Show">
                <rect x="1133" y="770" width="274" height="57" />
              </a>
              <a href="gallery.html" aria-label="Gallery (bottom sign: Food and Drinks)">
                <rect x="1132" y="834" width="275" height="59" />
              </a>
            </g>
        </svg>
        <nav class="mobile-midway-nav" aria-label="Midway attractions">
          <a href="bigtop.html">Big Top</a>
          <a href="funhouse.html">Funhouse</a>
          <a href="games.html">Games</a>
          <a href="music.html">🎵 Music Tent</a>
          <a href="freakshow.html">Freak Show</a>
          <a href="gallery.html">Gallery</a>
        </nav>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
