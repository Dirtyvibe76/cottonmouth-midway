name: Update latest Cottonmouth track
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cottonmouth-now-playing
  cancel-in-progress: false

jobs:
  update-music-tent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YouTube metadata reader
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Refresh newest video
        env:
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
        run: python scripts/update_now_playing.py
      - name: Publish if changed
        run: |
          if ! git diff --quiet -- music.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add music.html
            git commit -m "Update Music Tent Now Playing from YouTube"
            git push
          fi
